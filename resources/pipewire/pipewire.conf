# PipeWire daemon for SteamARM's ARM64 guests (scripts/pipewire.sh).
#
# The Steam client talks to PipeWire for its own audio settings and voice
# (wpctl from libaudio.so); without a PipeWire server its audio settings had
# no devices. This daemon has no device of its own: tunnels.conf, a client of
# it, adds one sink and one source that lead to the Mac's PulseAudio server
# (scripts/audio.sh). Games keep using that PulseAudio server directly
# (PULSE_SERVER, and SDL_AUDIO_DRIVER=pulseaudio from settings-env.py), and
# there is no pipewire-pulse to take their traffic.
context.properties = {
    core.daemon                 = true
    core.name                   = pipewire-0
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 1024
    mem.allow-mlock             = false
    support.dbus                = false
    log.level                   = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    # One user, local sockets only: every client gets full access. Without
    # an access policy a client waits "busy" for a session manager's
    # verdict and never gets an answer.
    { name = libpipewire-module-access
      args = { access.socket = { pipewire-0 = "unrestricted" pipewire-0-manager = "unrestricted" } } }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-device-factory }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]
