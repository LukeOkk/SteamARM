# The sink and source of SteamARM's PipeWire (resources/pipewire/pipewire.conf):
# tunnels to the Mac's PulseAudio server. In a client process of the daemon:
# module-pulse-tunnel connects to PipeWire as a client, and inside the
# daemon's own start-up there was no daemon to connect to ("can't connect:
# Host is down"). Both streams stay corked on the Mac's server while nothing
# uses them (the Mac's microphone is opened only when a guest records).
context.properties = {
    mem.allow-mlock = false
    support.dbus    = false
    log.level       = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-pulse-tunnel
      args = {
          tunnel.mode          = sink
          pulse.server.address = "unix:/tmp/pulse/native"
          audio.format         = F32
          audio.rate           = 48000
          audio.channels       = 2
          audio.position       = [ FL FR ]
          stream.props = {
              node.name        = "steamarm.mac.output"
              node.description = "Mac (sonido)"
          }
      }
    }
    { name = libpipewire-module-pulse-tunnel
      args = {
          tunnel.mode          = source
          pulse.server.address = "unix:/tmp/pulse/native"
          audio.format         = F32
          audio.rate           = 48000
          audio.channels       = 2
          audio.position       = [ FL FR ]
          stream.props = {
              node.name        = "steamarm.mac.input"
              node.description = "Mac (micrófono)"
          }
      }
    }
]
