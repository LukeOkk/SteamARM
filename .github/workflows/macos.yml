# Build and test on a macOS Apple Silicon runner, and publish a release when a
# v* tag is pushed, or when the workflow is run by hand on main with a tag
# name in "release" (gh then creates the tag on that commit). The runner is a GitHub-hosted macOS arm64 machine: it
# builds everything the Makefile builds and runs the tests that need no Linux
# roots (tests/elf, tests/win and Steam need a full setup on a real Mac).
name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (e.g. v0.3.4), created on the dispatched commit of main"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Homebrew dependencies
        run: brew install llvm lld vulkan-headers sdl2 sdl3 pulseaudio

      - name: Build (lxrun, vdso, Vulkan shim, inputd, launcher)
        run: make all

      # The Makefile links lxrun as built against the macOS 12.3 SDK
      # (LXRT_KEEP_X18=1, the default since stage 28) so the kernel keeps x18
      # for code the runtime never rewrites (a JIT's); when that link fails it
      # falls back to the current SDK and says so. Say it here too.
      - name: lxrun records SDK 12.3 (x18 kept for JIT code)
        run: |
          sdk=$(otool -l build/lxrun | awk '/LC_BUILD_VERSION/{f=1} f && $1 == "sdk" {print $2; exit}')
          echo "lxrun LC_BUILD_VERSION sdk $sdk"
          if [ "${sdk%%.*}" -ge 13 ]; then
            echo "::warning title=lxrun links against SDK $sdk::the SDK 12.3 link fell back (see the Build step); the kernel will zero x18 for JIT code (docs/X18_VIRTUALIZATION.md)"
          fi

      - name: Launcher core (ApplicationCore, run-app.sh dispatch, sessions)
        run: make test-launcher-core

      - name: x18 decoder/planner self-test
        run: make build/x18_check && build/x18_check --self-test

      - name: Audio (one PulseAudio server, a socket per guest root)
        run: tests/audio/run.sh

      - name: x18 across preemption (measurement on the runner, see benchmarks/stage19 §3a)
        run: tests/x18_preserve/run.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event.inputs.release != '' && github.ref == 'refs/heads/main')
    needs: build-test
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.release || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Homebrew dependencies
        run: brew install sdl2 sdl3

      - name: Package (scripts/make-release.sh)
        run: scripts/make-release.sh

      - name: Version matches the tag
        run: |
          v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" launcher/Info.plist.in)
          [ "v$v" = "$TAG" ] || { echo "Info.plist.in says $v, tag is $TAG"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${TAG#v}
          notes=docs/releases/$TAG.md
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          # --target only matters when the tag does not exist yet (a run by hand).
          gh release create "$TAG" --target "$GITHUB_SHA" --title "SteamARM $v" --notes-file "$notes" --prerelease \
              build/release/SteamARM-$v-macOS-arm64.dmg \
              build/release/SteamARM-$v-macOS-arm64.zip \
              build/release/SHA256SUMS.txt
